[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labnotescan"
version = "0.1.0"
description = "Offline lab note OCR-to-Markdown converter"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LabNoteScan"}]
dependencies = [
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pypdf>=3.15.0",
    "pypdfium2>=4.20.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
labnotescan = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
