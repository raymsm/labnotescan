[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labnotescan"
version = "0.1.0"
description = "Offline lab note OCR-to-Markdown converter"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "LabNoteScan"}]
dependencies = []

[project.scripts]
labnotescan = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
